<form [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <tui-textfield>
      <input name="name" tuiAutoFocus tuiInput formControlName="name" />
    </tui-textfield>
    @if (nameControl.invalid && nameControl.touched) {
      <tui-error [error]="'Название не может быть короче 1 символа'" />
    }
  </div>
  <footer>
    <button
      appearance="secondary"
      size="m"
      tuiButton
      type="button"
      (click)="context.$implicit.complete()"
    >
      Отмена
    </button>
    <button size="m" tuiButton type="submit" [disabled]="form.invalid">Сохранить</button>
  </footer>
</form>
